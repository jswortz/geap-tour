[project]
name = "geap-tour"
version = "0.1.0"
description = "GEAP Workshop: Multi-agent systems with ADK, MCP, evaluation, and observability on Google Cloud"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.163.0,<2.0.0",
    "google-genai>=2.14.0",
    "fastmcp>=2.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "google-cloud-monitoring>=2.31.0",
    "google-cloud-bigquery>=3.42.2",
    "litellm>=1.83.14",
    "pandas>=3.0.1",
    "a2a-sdk==0.3.26",
    "google-adk[agent-identity,eval]>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "playwright>=1.40",
]
