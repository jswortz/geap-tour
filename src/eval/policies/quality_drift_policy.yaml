# GEAP Agent Quality Drift alert policy (generated by export_policy_yaml).
# Create it with:
#   gcloud monitoring policies create --policy-from-file=src/eval/policies/quality_drift_policy.yaml
# See: https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/quality-alerts
displayName: GEAP Agent Quality Drift - Low Task Success
documentation:
  mimeType: text/markdown
  content: "## GEAP Agent Quality Drift\n\nThe agent's `task_success` online-evaluation\
    \ score has dropped below 0.8. Configuring an Online Monitor auto-exports numeric\
    \ evaluation scores to the Cloud Monitoring metric type `aiplatform.googleapis.com/online_evaluator/scores`,\
    \ labelled by `evaluation_metric_name`. A sustained drop in the mean score is\
    \ a signal of quality drift \u2014 the deployed agent is regressing relative to\
    \ its evaluated baseline.\n\n**What to check:** recent online-evaluation traces\
    \ for failing sessions, model/prompt/tool changes deployed in the alert window,\
    \ and upstream data or MCP tool availability."
conditions:
- displayName: task_success online_evaluator score below 0.8
  conditionThreshold:
    filter: metric.type="aiplatform.googleapis.com/online_evaluator/scores" AND metric.labels.evaluation_metric_name="task_success"
    comparison: COMPARISON_LT
    thresholdValue: 0.8
    duration: 1800s
    aggregations:
    - alignmentPeriod: 60s
      perSeriesAligner: ALIGN_MEAN
combiner: OR
enabled: true
